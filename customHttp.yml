# Response headers for AWS Amplify Hosting (applied on deploy).
# Replaces the headers in vercel.json, which Amplify ignores.
#
# CSP allow-list: Google Analytics 4 (loaded only after cookie consent) and
# the Google Forms waitlist endpoint. Fonts and images are self-hosted.
# If you add a new third-party script, image host or API, add it here or
# the browser will block it.
customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=()'
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://docs.google.com; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://docs.google.com"
  - pattern: 'assets/**/*'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
